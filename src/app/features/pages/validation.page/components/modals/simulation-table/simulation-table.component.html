<!-- simulation-table.component.html -->
@if (dataSource){
	<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
		<ng-container matColumnDef="selecteds">
			<th mat-header-cell *matHeaderCellDef> Selecteds</th>
			<td mat-cell *matCellDef="let element"> {{ element.selecteds }}</td>
		</ng-container>

		<ng-container matColumnDef="mutation_rate">
			<th mat-header-cell *matHeaderCellDef> Mutation Rate</th>
			<td mat-cell *matCellDef="let element"> {{ element.mutation_rate }}</td>
		</ng-container>

		<ng-container matColumnDef="population">
			<th mat-header-cell *matHeaderCellDef> Population</th>
			<td mat-cell *matCellDef="let element"> {{ element.population }}</td>
		</ng-container>

		<ng-container matColumnDef="avg_time_delta">
			<th mat-header-cell *matHeaderCellDef> Avg Time Delta</th>
			<td mat-cell *matCellDef="let element"> {{ element.avg_time_delta }}</td>
		</ng-container>

		<ng-container matColumnDef="max_generations">
			<th mat-header-cell *matHeaderCellDef> Max Generations</th>
			<td mat-cell *matCellDef="let element"> {{ element.max_generations }}</td>
		</ng-container>

		<ng-container matColumnDef="min_generations">
			<th mat-header-cell *matHeaderCellDef> Min Generations</th>
			<td mat-cell *matCellDef="let element"> {{ element.min_generations }}</td>
		</ng-container>

		<ng-container matColumnDef="actions">
			<th mat-header-cell *matHeaderCellDef> Actions</th>
			<td mat-cell *matCellDef="let element">
				<button mat-raised-button color="primary" (click)="openGenerations(element)">View Generations</button>
			</td>
		</ng-container>

		<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
		<tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
	</table>
} @else {
	<mat-progress-bar mode="query"></mat-progress-bar>
}
