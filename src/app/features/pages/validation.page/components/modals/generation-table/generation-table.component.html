<h2 mat-dialog-title>Generations</h2>

<mat-dialog-content>
	<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
		<ng-container matColumnDef="simulation_id">
			<th mat-header-cell *matHeaderCellDef> Simulation ID</th>
			<td mat-cell *matCellDef="let element"> {{ element.simulation_id }}</td>
		</ng-container>

		<ng-container matColumnDef="citizens">
			<th mat-header-cell *matHeaderCellDef> Citizens Count</th>
			<td mat-cell *matCellDef="let element"> {{ element.citizens.length }}</td>
		</ng-container>

		<ng-container matColumnDef="bestTime">
			<th mat-header-cell *matHeaderCellDef>Best Time</th>
			<td mat-cell *matCellDef="let element"> {{ element.citizens | generationBestTime }}s </td>

		</ng-container>

		<ng-container matColumnDef="actions">
			<th mat-header-cell *matHeaderCellDef> Actions</th>
			<td mat-cell *matCellDef="let element">
				<button mat-raised-button color="accent" (click)="openCitizens(element.citizens)">View Citizens</button>
			</td>
		</ng-container>

		<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
		<tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
	</table>
</mat-dialog-content>
<mat-dialog-actions>
	<button mat-raised-button matDialogClose>Close</button>
	<button mat-flat-button color="primary" (click)="openGraph()"><mat-icon>query_stats</mat-icon> Show graph</button>
</mat-dialog-actions>
