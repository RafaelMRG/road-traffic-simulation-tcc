<h2 mat-dialog-title>Gerações</h2>

<mat-dialog-content>
	<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
		<ng-container matColumnDef="row">
			<th mat-header-cell *matHeaderCellDef>#</th>
			<td mat-cell *matCellDef="let element; let i = index"> {{ i + 1 }}</td>
		</ng-container>

		<ng-container matColumnDef="generationId">
			<th mat-header-cell *matHeaderCellDef> ID</th>
			<td mat-cell *matCellDef="let element"> {{ element.generationId }}</td>
		</ng-container>

		<ng-container matColumnDef="citizens">
			<th mat-header-cell *matHeaderCellDef> Cidadões</th>
			<td mat-cell *matCellDef="let element"> {{ element.citizens.length }}</td>
		</ng-container>

		<ng-container matColumnDef="bestTime">
			<th mat-header-cell *matHeaderCellDef>Melhor tempo</th>
			<td mat-cell *matCellDef="let element"> {{ element.citizens | generationBestTime }}s </td>

		</ng-container>

		<ng-container matColumnDef="actions">
			<th mat-header-cell *matHeaderCellDef> Ação</th>
			<td mat-cell *matCellDef="let element">
				<button mat-raised-button color="accent" (click)="openCitizens(element.citizens)">Vis. cidadão</button>
			</td>
		</ng-container>

		<ng-container matColumnDef="createdAt">
			<th mat-header-cell *matHeaderCellDef>Criado em</th>
			<td mat-cell *matCellDef="let element"> {{ (element.createdAt + 'Z') | date: 'dd-MM-yyyy HH:mm:ss' }} </td>
		</ng-container>

		<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
		<tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
	</table>
</mat-dialog-content>
<mat-dialog-actions>
	<button mat-raised-button matDialogClose>Fechar</button>
	<button mat-flat-button color="primary" (click)="openGraph()"><mat-icon>query_stats</mat-icon> Mostrar gráfico</button>
	<button mat-flat-button color="accent" (click)="openBest()"><mat-icon>star</mat-icon> Mostrar melhor cenário</button>
</mat-dialog-actions>
