<h1 mat-dialog-title>Configuração de operação de otimização</h1>
<div mat-dialog-content class="py-3">
  <div>
    <form [formGroup]="optimizationSettingsSvc.runSettings">
      <div class="row">
        <h6>Configuração por geração</h6>
        <div class="col-auto">
          <mat-form-field>
            <mat-label>N° de iterações</mat-label>
            <input matInput type="number" formControlName="population">
            @if (optimizationSettingsSvc.runSettings.controls.population.value !== 4) {
            <button matSuffix mat-icon-button aria-label="Limpar" (click)="optimizationSettingsSvc.runSettings.controls.population.setValue(4)">
              <mat-icon>close</mat-icon>
            </button>
            }
          </mat-form-field>
        </div>

        <div class="col-auto">
          <mat-form-field>
            <mat-label>Tempo simulado</mat-label>
            <input #simulatedTime matInput type="number" formControlName="simulatedTime">
            @if (optimizationSettingsSvc.runSettings.controls.simulatedTime.value !== 120) {
            <button matSuffix mat-icon-button aria-label="Limpar"
              (click)="optimizationSettingsSvc.runSettings.controls.simulatedTime.setValue(120)">
              <mat-icon>close</mat-icon>
            </button>
            }
          </mat-form-field>
        </div>
      </div>

    </form>
  </div>

    
</div>

<div mat-dialog-actions class="d-flex justify-content-between px-4">
  <button mat-flat-button color="warn" mat-dialog-close>Fechar</button>
  <button (click)="optimizationSettingsSvc.startSimulation()" mat-raised-button color="primary" mat-dialog-close>Iniciar simulação</button>
</div>
